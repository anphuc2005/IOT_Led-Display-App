name: smart_led_control
description: Smart LED Control App for ESP32 via MQTT with AI Assistant
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mqtt_client: ^10.6.0
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  flutter_colorpicker: ^1.1.0
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  google_fonts: ^6.2.1
  fl_chart: ^0.69.2
  animated_text_kit: ^4.2.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true
